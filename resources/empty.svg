<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="#7A7D8B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- 数据表卡片轮廓 -->
  <rect x="38" y="28" width="100" height="104" rx="8"/>
  <!-- 表头分隔线 -->
  <line x1="38" y1="52" x2="138" y2="52"/>
  <!-- 表头列分隔 -->
  <line x1="72"  y1="28" x2="72"  y2="52" stroke="#5A5D6F"/>
  <line x1="106" y1="28" x2="106" y2="52" stroke="#5A5D6F"/>
  <!-- 空行:虚线占位 -->
  <line x1="50" y1="68"  x2="126" y2="68"  stroke-dasharray="3 5"/>
  <line x1="50" y1="84"  x2="126" y2="84"  stroke-dasharray="3 5"/>
  <line x1="50" y1="100" x2="126" y2="100" stroke-dasharray="3 5"/>
  <line x1="50" y1="116" x2="126" y2="116" stroke-dasharray="3 5"/>
  <!-- 放大镜:暖珊瑚强调色 -->
  <circle cx="152" cy="44" r="14" stroke="#FF6B5C" stroke-width="2"/>
  <line x1="161.5" y1="54" x2="174" y2="66.5" stroke="#FF6B5C" stroke-width="2.5"/>
  <!-- 散落的小色点 -->
  <circle cx="18"  cy="42"  r="2.4" fill="#FF6B5C" stroke="none"/>
  <circle cx="184" cy="124" r="2.4" fill="#D4A574" stroke="none"/>
  <circle cx="26"  cy="130" r="2"   fill="#7A7D8B" stroke="none"/>
  <circle cx="170" cy="20"  r="1.8" fill="#7A7D8B" stroke="none"/>
</svg>
